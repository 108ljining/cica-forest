<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시카숲 쉼터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
[hidden]{display:none!important}
/* Layout concept: a full-bleed night forest you walk through; every control floats at the screen edges so the 3D scene stays the page. */
:root{
  --bg:#0a1626;
  --fg:#eaf6f1;
  --muted:#9fbdb6;
  --gold:#f5d77a;
  --mint:#b8f0e0;
  --ink:#1a2433;
  --panel:rgba(11,20,38,.68);
  --line:rgba(255,255,255,.26);
  --dew:#7fe3ff;
  --font-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;pointer-events:none}
.chip{padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:14px;white-space:nowrap}
.chip.title{font-family:var(--font-display);font-size:18px;color:#f6f0d0;border-color:rgba(245,215,122,.5)}
#top-left{top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px))}
#top-left{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.rtag > div{padding:2px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--fg);white-space:nowrap}
.btn.small{min-height:36px;font-size:15px;padding:0 16px;border-radius:999px}
.sheet{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.sheet-in{pointer-events:auto;width:min(420px,100%);box-sizing:border-box;padding:14px 16px;border-radius:20px;background:rgba(11,20,38,.88);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slabel{width:48px;font-family:var(--font-display);color:#f6f0d0;font-size:15px}
.pick{display:flex;align-items:center;gap:2px;padding:2px;border-radius:999px;background:rgba(255,255,255,.08)}
.pick b{min-width:70px;text-align:center;font-weight:400;font-size:14px;color:var(--fg)}
.arr{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--fg);font-size:18px;cursor:pointer;padding:0}
.arr.dice{width:auto;padding:0 12px;border-radius:999px;font-size:13px}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.28);cursor:pointer;padding:0}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,215,122,.5)}
.sw:focus-visible,.arr:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#top-right{top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#minimap{width:88px;height:88px;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
#zonechip{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.drops{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.drops svg{width:18px;height:18px}
.drops path{fill:none;stroke:var(--dew);stroke-opacity:.5;stroke-width:1.5}
.drops .on path{fill:var(--dew);stroke-opacity:1}
#hint{top:calc(env(safe-area-inset-top,0px) + 60px);left:0;right:0;text-align:center;font-size:14px;color:var(--mint);transition:opacity .8s}
#hint span{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--panel)}
.tag{position:fixed;left:0;top:0;pointer-events:none;will-change:transform}
.tag > div{transform:translate(-50%,-100%)}
#nametag > div{padding:3px 11px;border-radius:999px;background:var(--panel);border:1px solid rgba(245,215,122,.45);font-size:13px;color:#f6f0d0;white-space:nowrap}
#bubble > div{padding:9px 15px;border-radius:16px;background:#f7f5ee;color:var(--ink);font-size:15px;white-space:nowrap;position:relative;margin-left:70px}
#bubble > div::after{content:"";position:absolute;left:14px;bottom:-5px;width:11px;height:11px;background:#f7f5ee;transform:rotate(45deg)}
.zlabel > div{padding:5px 12px;border-radius:999px;background:var(--panel);border:1px solid rgba(245,215,122,.4);font-family:var(--font-display);font-size:15px;color:#f6f0d0;white-space:nowrap}
#joy{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 44px);width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:rgba(245,215,122,.8);border:1px solid rgba(255,255,255,.5)}
#actions{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 44px);display:flex;flex-direction:column;gap:8px;align-items:stretch;width:176px}
.btn{pointer-events:auto;min-height:48px;border-radius:24px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-family:var(--font-display);font-size:17px;cursor:pointer;padding:0 14px}
.btn.primary{background:var(--gold);color:var(--ink);border:0}
.btn:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.demo{pointer-events:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
#footnote{left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;font-size:12px;color:var(--muted)}
#timer{left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#timer .ring{position:relative;width:124px;height:124px;border-radius:50%;background:var(--panel)}
#timer svg{position:absolute;inset:0;width:124px;height:124px;transform:rotate(-90deg)}
#timer circle{fill:none;stroke-width:6}
#timer .track{stroke:rgba(255,255,255,.14)}
#timer .prog{stroke:var(--gold);stroke-linecap:round}
#timer .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#timer .lbl{font-size:12px;color:var(--mint)}
#timer .num{font-family:var(--font-display);font-size:32px;color:#f6f0d0;font-variant-numeric:tabular-nums}
#timer .st{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--panel);color:var(--fg)}
#timer .btn{margin-top:4px;min-height:40px;font-size:15px}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:24px max(24px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 72px);background:linear-gradient(to bottom,rgba(10,22,38,.55),rgba(10,22,38,0) 40%,rgba(10,22,38,.0) 60%,rgba(10,22,38,.7));transition:opacity .9s}
#intro h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:46px;line-height:1.1;color:#f6f0d0;text-align:center}
#intro p{margin:0;color:var(--mint);font-size:16px;text-align:center}
#intro .top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);left:0;right:0;display:flex;flex-direction:column;gap:10px;align-items:center}
#intro .btn{width:min(300px,100%);min-height:56px;font-size:21px;border-radius:28px}
#intro small{color:var(--muted);font-size:13px}
#card-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,10,20,.66);padding:16px}
.card{width:min(300px,100%);border-radius:22px;padding:22px 20px 18px;color:#f6f0d0;display:flex;flex-direction:column;gap:14px;border:1px solid rgba(245,215,122,.5);text-align:center;background:linear-gradient(160deg,#17434f,#0e2036)}
.card .zn{font-family:var(--font-display);font-size:22px}
.card .cy{align-self:center;padding:3px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--fg)}
.card .msg{font-family:var(--font-display);font-size:21px;line-height:1.5;margin:10px 0;text-wrap:balance}
.card .meta{font-size:12px;color:var(--muted)}
.card .drops{justify-content:center}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);font-size:16px}
@media (max-width:420px){#intro h1{font-size:40px}}
</style>

</head>
<body>
<canvas id="c" aria-label="시카숲 3D 장면"></canvas>

<div class="ui" id="top-left" hidden><span class="chip title">시카숲 쉼터</span><span class="chip" id="pcount" hidden></span><button type="button" class="btn small" id="bcustom">꾸미기</button></div>
<div class="ui" id="top-right" hidden>
  <canvas id="minimap" width="176" height="176" aria-hidden="true"></canvas>
  <div id="zonechip" hidden>
    <span class="chip title" id="zn"></span>
    <span class="chip" id="zcy"></span>
    <span class="chip drops" id="zdrops"><span>따끔 지수</span><span class="on"></span></span>
  </div>
</div>
<div class="ui" id="hint" hidden><span>왼쪽 조이스틱이나 바닥을 눌러 걸어가 보세요. 화면을 끌면 시점이 돌아가요.</span></div>

<div class="tag" id="nametag"><div id="nametext">조용한 이슬</div></div>
<div class="tag" id="bubble" hidden><div id="bubbletext"></div></div>
<div class="tag zlabel" id="zl0"><div>100 · 이슬 숲</div></div>
<div class="tag zlabel" id="zl1"><div>300 · 안개 숲</div></div>
<div class="tag zlabel" id="zl2"><div>700 · 깊은 숲</div></div>

<div class="ui" id="timer" hidden>
  <div class="ring">
    <svg viewBox="0 0 124 124" aria-hidden="true"><circle class="track" cx="62" cy="62" r="54"/><circle class="prog" id="prog" cx="62" cy="62" r="54" stroke-dasharray="339.3" stroke-dashoffset="339.3"/></svg>
    <div class="mid"><span class="lbl">스며드는 3분</span><span class="num" id="tnum">3:00</span></div>
  </div>
  <span class="st" id="tst">이슬이 천천히 스며드는 중</span>
  <button type="button" class="btn" id="tcancel">그만 쉬기</button>
</div>

<div class="ui" id="joy" hidden role="group" aria-label="이동 조이스틱"><div id="knob"></div></div>
<div class="ui" id="actions" hidden>
  <button type="button" class="btn" id="bdew"></button>
  <button type="button" class="btn primary" id="bapply">리들샷 바르기</button>
  <label class="demo"><input type="checkbox" id="demo"> 시연용: 3분 대신 10초</label>
</div>
<p class="ui" id="footnote" hidden>연출이에요. 실제 느낌은 사람마다 달라요</p>

<div class="overlay" id="intro">
  <div class="top">
    <h1>시카숲 쉼터</h1>
    <p>밤의 숲을 걸으며 잠깐 쉬어가요</p>
  </div>
  <button type="button" class="btn primary" id="enter">숲으로 들어가기</button>
  <small>가입 없이 바로 들어가요</small>
</div>

<div id="custom" class="sheet" hidden role="dialog" aria-label="캐릭터 꾸미기">
  <div class="sheet-in">
    <div class="srow"><span class="slabel">이름</span>
      <span class="pick"><button type="button" class="arr" data-k="a" data-d="-1" aria-label="앞 단어 이전">‹</button><b id="cadj"></b><button type="button" class="arr" data-k="a" data-d="1" aria-label="앞 단어 다음">›</button></span>
      <span class="pick"><button type="button" class="arr" data-k="n" data-d="-1" aria-label="뒤 단어 이전">‹</button><b id="cnoun"></b><button type="button" class="arr" data-k="n" data-d="1" aria-label="뒤 단어 다음">›</button></span>
      <button type="button" class="arr dice" id="crand" aria-label="이름 랜덤">랜덤</button>
    </div>
    <div class="srow"><span class="slabel">옷</span><span class="sws" id="sw-o"></span></div>
    <div class="srow"><span class="slabel">모자</span><span class="sws" id="sw-h"></span></div>
    <div class="srow"><span class="slabel">이파리</span><span class="sws" id="sw-l"></span></div>
    <button type="button" class="btn primary" id="cdone">완료</button>
  </div>
</div>

<div id="card-wrap" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-label="오늘의 마음 카드">
    <div class="zn" id="cz"></div>
    <span class="cy" id="cc"></span>
    <div class="msg" id="cm"></div>
    <div class="drops" id="cd"><span>따끔 지수</span><span class="on"></span></div>
    <div class="meta" id="cmeta"></div>
    <button type="button" class="btn primary" id="cclose">다시 숲으로</button>
  </div>
</div>

<div id="err" hidden>이 화면은 3D를 지원하는 브라우저에서 열어 주세요.</div>

<script>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
if(typeof THREE==='undefined'){$('#err').hidden=false;return;}
var renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});}catch(e){$('#err').hidden=false;return;}
var V3=THREE.Vector3;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1a28);
scene.fog=new THREE.FogExp2(0x0d2233,0.021);
var camera=new THREE.PerspectiveCamera(55,1,0.1,260);

function rngMaker(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=rngMaker(7);

function glowTex(){var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d');var g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.3,'rgba(255,255,255,0.45)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
var GLOW=glowTex();
function grassTex(){var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d');x.fillStyle='#1c4a3f';x.fillRect(0,0,256,256);for(var i=0;i<1600;i++){x.fillStyle=Math.random()<0.5?'rgba(10,40,34,0.6)':'rgba(80,150,115,0.32)';x.fillRect(Math.random()*256,Math.random()*256,2,6);}var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(70,70);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x8fb0e0,0x24503f,0.9));
var moonLight=new THREE.DirectionalLight(0xbcd2ff,0.8);
moonLight.castShadow=true;
moonLight.shadow.mapSize.set(1024,1024);
var sc=moonLight.shadow.camera;sc.left=-14;sc.right=14;sc.top=14;sc.bottom=-14;sc.near=1;sc.far=70;
scene.add(moonLight);scene.add(moonLight.target);
var avatarLight=new THREE.PointLight(0xffe9c0,0.55,9,2);
scene.add(avatarLight);
var glowLight=new THREE.PointLight(0xf5d77a,0,10,2);
scene.add(glowLight);

var ground=new THREE.Mesh(new THREE.CircleGeometry(95,64),new THREE.MeshStandardMaterial({map:grassTex(),roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

var starGeo=new THREE.BufferGeometry();var sp=[];
for(var si=0;si<420;si++){var th=Math.random()*Math.PI*2,ph=Math.acos(0.15+Math.random()*0.85);sp.push(150*Math.sin(ph)*Math.cos(th),150*Math.cos(ph),150*Math.sin(ph)*Math.sin(th));}

scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xcfe6ff,size:1.6,sizeAttenuation:false,fog:false,transparent:true,opacity:0.8})));
var moon=new THREE.Mesh(new THREE.SphereGeometry(5,24,16),new THREE.MeshBasicMaterial({color:0xf8f3dc,fog:false}));
moon.position.set(-55,60,-110);scene.add(moon);
var moonGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:0xf6f0d0,transparent:true,opacity:0.55,fog:false,depthWrite:false}));
moonGlow.scale.set(40,40,1);moonGlow.position.copy(moon.position);scene.add(moonGlow);

/* ---------- zones ---------- */
var ZONES=[
 {id:100,name:'이슬 숲',label:'100 · 이슬 숲',cycle:'매일',pos:new V3(-26,0,-16),r:9,level:1,tint:0x9ff0d0,action:'이슬 톡 눌러보기',bubble:'톡! 살짝 따끔?',
  cards:['오늘도 작게 쉬었어요. 그걸로 충분해요.','천천히 스며드는 중이에요. 서두르지 않아도 돼요.','매일 조금씩, 나에게 돌아오는 시간.']},
 {id:300,name:'안개 숲',label:'300 · 안개 숲',cycle:'3일마다',pos:new V3(0,0,-38),r:10,level:2,tint:0x8fd0ff,action:'연잎 이슬 눌러보기',bubble:'오, 좀 따끔하네요',
  cards:['사흘에 한 번쯤은 조금 더 깊이 쉬어요.','안개가 걷히면 길이 보여요. 지금은 잠깐 앉아 있어요.','찡해도 괜찮아요. 지나가고 나면 마음이 가벼워져요.']},
 {id:700,name:'깊은 숲',label:'700 · 깊은 숲',cycle:'7일마다',pos:new V3(28,0,-16),r:11,level:3,tint:0xffe9a0,action:'별빛 샘 눌러보기',bubble:'으으, 찡하다!',
  cards:['일주일에 한 번, 크게 숨 쉬는 날.','깊은 숲에서는 아무것도 안 해도 돼요.','으으, 찡했지만 잘 견뎠어요. 오늘은 푹 쉬어요.']}
];
var updaters=[];

ZONES.forEach(function(z){
 var disc=new THREE.Mesh(new THREE.CircleGeometry(z.r,48),new THREE.MeshBasicMaterial({color:z.tint,transparent:true,opacity:0.14,depthWrite:false}));
 disc.rotation.x=-Math.PI/2;disc.position.set(z.pos.x,0.03,z.pos.z);scene.add(disc);
 var ring=new THREE.Mesh(new THREE.RingGeometry(z.r-0.14,z.r,72),new THREE.MeshBasicMaterial({color:z.tint,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false}));
 ring.rotation.x=-Math.PI/2;ring.position.set(z.pos.x,0.05,z.pos.z);scene.add(ring);
 var pl=new THREE.PointLight(z.tint,1.3,26,2);pl.position.set(z.pos.x,3.2,z.pos.z);scene.add(pl);
 z.light=pl;z.touched=false;
});
var hubRing=new THREE.Mesh(new THREE.RingGeometry(2.2,2.4,48),new THREE.MeshBasicMaterial({color:0xf5d77a,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false}));
hubRing.rotation.x=-Math.PI/2;hubRing.position.set(0,0.05,6);scene.add(hubRing);

var remotes={},myId=null,mpRef=null,mpOn=false,mpLast=0,mpSent={x:1e9,z:1e9,f:0,a:0},srvOff=0,mpCountT=0;
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

 remotes[id]={a:a,g:a.g,tx:d.x,tz:d.z,tf:d.f||0,app:d.a?1:0,t:d.t||0,tag:mkTag(nameOf(d.n)),nc:d.n,cc:d.c,phase:0,moving:false,face:''};

function onRemote(snap){
 var id=snap.key,d=snap.val();if(id===myId||!d||typeof d.x!=='number'||typeof d.z!=='number')return;
 if(Date.now()+srvOff-(d.t||0)>25000)return;
 var r=remotes[id];
 if(!r){if(Object.keys(remotes).length>=window.SIKA_MAX_PLAYERS-1)return;addRemote(id,d);r=remotes[id];}
 r.tx=d.x;r.tz=d.z;r.tf=d.f||0;r.app=d.a?1:0;r.t=d.t||r.t;
 if(r.nc!==d.n){r.nc=d.n;r.tag.firstChild.textContent=nameOf(d.n);}

}
function startTogether(){

 var base='https://www.gstatic.com/firebasejs/10.12.2/';

  firebase.initializeApp(cfg);var db=firebase.database(),pl=db.ref('players');
  return db.ref('.info/serverTimeOffset').once('value').then(function(s){srvOff=s.val()||0;return pl.once('value');}).then(function(snap){
   var now=Date.now()+srvOff,n=0;
   snap.forEach(function(c){var v=c.val();if(v&&now-(v.t||0)<25000)n++;else if(v&&now-(v.t||0)>120000)c.ref.remove();});
   if(n>=window.SIKA_MAX_PLAYERS){setCount('숲이 가득 찼어요 · 혼자 걷는 중');return;}
   myId='p'+Math.random().toString(36).slice(2,10);mpRef=pl.child(myId);
   mpRef.onDisconnect().remove();
   var p=avatar.g.position;
   return mpRef.set({x:+p.x.toFixed(2),z:+p.z.toFixed(2),f:+avatar.facing.toFixed(2),n:look.a*100+look.n,c:lookCode(),a:0,t:firebase.database.ServerValue.TIMESTAMP}).then(function(){
    mpOn=true;
    pl.on('child_added',onRemote);pl.on('child_changed',onRemote);
    pl.on('child_removed',function(s){removeRemote(s.key);});

  });

function mpUpdate(dt){
 if(!mpOn&&!Object.keys(remotes).length)return;
 try{
  var now=performance.now();
  if(mpOn&&mpRef){
   var p=avatar.g.position,ap=mode==='apply'?1:0;
   var moved=Math.hypot(p.x-mpSent.x,p.z-mpSent.z)>0.25||Math.abs(angDiff(mpSent.f,avatar.facing))>0.35;
   if((moved&&now-mpLast>350)||ap!==mpSent.a||now-mpLast>8000){
    mpLast=now;mpSent={x:p.x,z:p.z,f:avatar.facing,a:ap};
    mpRef.update({x:+p.x.toFixed(2),z:+p.z.toFixed(2),f:+avatar.facing.toFixed(2),a:ap,t:firebase.database.ServerValue.TIMESTAMP}).catch(function(){});
   }
  }
  var sn=Date.now()+srvOff;
  Object.keys(remotes).forEach(function(id){
   var r=remotes[id];
   if(sn-r.t>25000){removeRemote(id);return;}
   var g=r.g.position,dx=r.tx-g.x,dz=r.tz-g.z,d=Math.hypot(dx,dz),a=r.a;
   if(d>15){g.x=r.tx;g.z=r.tz;d=0;}
   else if(d>0.02){var k=Math.min(1,dt*6);g.x+=dx*k;g.z+=dz*k;}
   r.moving=d>0.12;
   var tf=r.moving?Math.atan2(dx,dz):r.tf;
   a.facing+=angDiff(a.facing,tf)*Math.min(1,dt*8);g.y=0;r.g.rotation.y=a.facing;
   if(r.moving)a.phase+=dt*9;
   var walk=r.moving?Math.sin(a.phase):0;
   a.body.position.y=Math.abs(walk)*0.07+(r.moving?0:Math.sin(clock*1.6+a.phase)*0.012);
   a.armL.rotation.x=walk*0.8*(r.app?0:1);
   a.armR.rotation.x=r.app?-2.2:-walk*0.8;
   a.feetL.position.z=0.08+walk*0.2;a.feetR.position.z=0.08-walk*0.2;
   var face=r.app?'relax':'open';
   if(r.face!==face){r.face=face;a.setFace(face,'smile',false);a.bottle.visible=!!r.app;}
  });
  if(clock-mpCountT>1){mpCountT=clock;if(mpOn)setCount('지금 숲에 '+(Object.keys(remotes).length+1)+'명');}
 }catch(e){}
}

function update(dt){
 clock+=dt;
 for(var i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){var f=timers[i].fn;timers.splice(i,1);f();}}
 var p=avatar.g.position;
 /* movement */
 var mvx=0,mvz=0,mag=0;
 if(mode==='free'){
  var ix=joy.x+((keys['d']||keys['arrowright'])?1:0)-((keys['a']||keys['arrowleft'])?1:0);
  var iy=joy.y+((keys['w']||keys['arrowup'])?1:0)-((keys['s']||keys['arrowdown'])?1:0);
  var l=Math.hypot(ix,iy);
  if(l>0.12){auto=null;if(l>1){ix/=l;iy/=l;l=1;}var fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);mvx=fx*iy+rx*ix;mvz=fz*iy+rz*ix;mag=l;}
 }
 if(!mag&&auto&&mode!=='apply'&&mode!=='card'){
  var dx=auto.x-p.x,dz=auto.z-p.z,d=Math.hypot(dx,dz);
  if(d<0.2){var cb=auto.cb;auto=null;if(cb)cb();}else{mvx=dx/d;mvz=dz/d;mag=1;}
 }
 var speed=6.5;
 if(mag>0){
  p.x+=mvx*speed*mag*dt;p.z+=mvz*speed*mag*dt;
  avatar.phase+=dt*speed*mag*1.4;
  var target=Math.atan2(mvx,mvz);avatar.facing+=angDiff(avatar.facing,target)*Math.min(1,dt*10);
 }else if(faceCam){var cx=camera.position.x-p.x,cz=camera.position.z-p.z;avatar.facing+=angDiff(avatar.facing,Math.atan2(cx,cz))*Math.min(1,dt*6);}
 var rr=Math.hypot(p.x,p.z);if(rr>84){p.x*=84/rr;p.z*=84/rr;}
 for(var t=0;t<trees.length;t++){var tr=trees[t],ddx=p.x-tr.x,ddz=p.z-tr.z;if(Math.abs(ddx)<2.5&&Math.abs(ddz)<2.5){var dd=Math.hypot(ddx,ddz),mn=0.5*tr.s+0.5;if(dd<mn&&dd>0.001){p.x=tr.x+ddx/dd*mn;p.z=tr.z+ddz/dd*mn;}}}
 avatar.g.rotation.y=avatar.facing;
 /* 뾰족한 잔디 */
 thornCD-=dt;
 if(mode==='free'&&thornCD<=0){for(var th=0;th<thorns.length;th++){if(Math.hypot(p.x-thorns[th].x,p.z-thorns[th].z)<0.9){thornCD=2.5;hopT=0.5;setReaction(thornFake);react.dur=1.8;break;}}}
 if(hopT>0){hopT-=dt;p.y=Math.sin((1-Math.max(0,hopT)/0.5)*Math.PI)*0.7;}else p.y=0;
 /* pose */
 var walk=mag>0?Math.sin(avatar.phase):0;
 avatar.body.position.y=Math.abs(walk)*0.07*(mag>0?1:0)+(mag>0?0:Math.sin(clock*1.6)*0.012);
 var tgtApply=(mode==='apply')?1:0;poseApply+=(tgtApply-poseApply)*Math.min(1,dt*6);
 avatar.armL.rotation.x=walk*0.8*(1-poseApply);
 avatar.armR.rotation.x=-walk*0.8*(1-poseApply)+(-2.2)*poseApply;
 avatar.armR.rotation.z=-0.5*poseApply;
 avatar.feetL.position.z=0.08+walk*0.2;avatar.feetR.position.z=0.08-walk*0.2;
 /* reaction shake */
 if(react.dur>0){
  react.t+=dt;var k=react.t/react.dur;
  if(k<1){var amp=0.08*react.level*(1-k);avatar.head.rotation.z=Math.sin(react.t*38)*amp;var ea=0.12*react.level*(1-k);avatar.earL.rotation.z=0.3+Math.sin(react.t*46)*ea;avatar.earR.rotation.z=-0.3-Math.sin(react.t*46+1)*ea;avatar.leafG.rotation.z=Math.sin(react.t*30)*0.2*react.level*(1-k);}
  else{react.dur=0;avatar.head.rotation.z=0;avatar.earL.rotation.z=0.3;avatar.earR.rotation.z=-0.3;avatar.leafG.rotation.z=0;if(mode!=='apply')avatar.setFace('open','smile',false);}
 }else{avatar.earL.rotation.z=0.3+Math.sin(clock*1.3)*0.03;avatar.earR.rotation.z=-0.3-Math.sin(clock*1.1)*0.03;avatar.leafG.rotation.z=Math.sin(clock*1.8)*0.05;}
 if(bubbleUntil&&clock>bubbleUntil){$('#bubble').hidden=true;bubbleUntil=0;}
 /* drops */
 for(var di=drops.length-1;di>=0;di--){var dr=drops[di];dr.vy+=14*dt;dr.m.position.y-=dr.vy*dt;if(dr.m.position.y<2.6){scene.remove(dr.m);drops.splice(di,1);if(!react.dur||react.t>0.5){setReaction(dr.z);}else{flashV=0.8;addRipple(avatar.g.position,dr.z.tint);}}}
 for(var ri=ripples.length-1;ri>=0;ri--){var rp=ripples[ri];rp.t+=dt;var u=rp.t/1.1;if(u>=1){scene.remove(rp.m);ripples.splice(ri,1);continue;}rp.m.scale.setScalar(1+u*7);rp.m.material.opacity=0.8*(1-u);}
 /* apply */
 var apTarget=0;
 if(mode==='apply'){
  applyT+=dt;var pr=Math.min(1,applyT/applyDur);
  $('#prog').style.strokeDashoffset=String(339.3*(1-pr));$('#tnum').textContent=fmt(applyDur-applyT);
  $('#tst').textContent=pr<0.4?'이슬이 천천히 스며드는 중':(pr<0.8?'숨을 크게 한 번 쉬어 볼까요':'거의 다 됐어요');
  avatar.leafMat.emissiveIntensity=0.2+pr*0.9;apTarget=0.9;glowLight.intensity=0.6+pr*1.4;glowLight.position.set(p.x,2.2,p.z+0.6);
  if(pr>=1)endApply(true);
 }else{avatar.leafMat.emissiveIntensity+=(0.2-avatar.leafMat.emissiveIntensity)*Math.min(1,dt*2);glowLight.intensity+=(0-glowLight.intensity)*Math.min(1,dt*3);}
 if(flashV>0){flashV=Math.max(0,flashV-dt*1.6);glowLight.intensity=Math.max(glowLight.intensity,flashV*2.2);glowLight.position.set(p.x,2.4,p.z+0.6);}
 apMat.opacity+=(apTarget-apMat.opacity)*Math.min(1,dt*3);
 for(var q=0;q<AP;q++){var s=apState[q];s.r-=dt*s.sp*(apTarget?1:0.4);s.a+=dt*0.9;if(s.r<0.25){s.r=3.5+Math.random()*3;s.h=0.3+Math.random()*2.4;}var tt=1-Math.min(1,s.r/6);apPos[q*3]=p.x+Math.cos(s.a)*s.r;apPos[q*3+1]=s.h+(2.1-s.h)*tt;apPos[q*3+2]=p.z+Math.sin(s.a)*s.r;}
 apGeo.attributes.position.needsUpdate=true;
 /* world */
 for(var u2=0;u2<updaters.length;u2++)updaters[u2](clock);
 for(var f=0;f<FF;f++){var d=ffSeed[f];ffPos[f*3]=d.x+Math.sin(clock*d.s+d.p)*1.4;ffPos[f*3+1]=d.y+Math.sin(clock*d.s*1.3+d.p)*0.7;ffPos[f*3+2]=d.z+Math.cos(clock*d.s*0.9+d.p)*1.4;}
 ffGeo.attributes.position.needsUpdate=true;
 mpUpdate(dt);
 moonLight.position.set(p.x-14,24,p.z-10);moonLight.target.position.set(p.x,0,p.z);
 /* zone ui */
 var z=nearZone();
 if(mode==='free'||mode==='seq'){
  if(z!==curZone){curZone=z;
   if(z){$('#zn').textContent=z.label;$('#zcy').textContent=z.cycle;fillDrops($('#zdrops'),z.level);$('#zonechip').hidden=false;$('#bdew').textContent=z.action;$('#actions').hidden=false;}
   else{$('#zonechip').hidden=true;$('#actions').hidden=true;}
  }
 }
 /* camera */
 if(mode==='intro'){cam.yaw+=dt*0.15;}
 cam.dist+=(cam.tdist-cam.dist)*Math.min(1,dt*3);
 var cp=Math.cos(cam.pitch);
 camera.position.set(p.x+Math.sin(cam.yaw)*cp*cam.dist,Math.max(0.7,p.y+1.9+Math.sin(cam.pitch)*cam.dist),p.z+Math.cos(cam.yaw)*cp*cam.dist);
 camera.lookAt(p.x,p.y+1.9,p.z);
 /* overlays */
 place($('#nametag'),new V3(p.x,3.1,p.z),-2);
 if(!$('#bubble').hidden)place($('#bubble'),new V3(p.x,3.2,p.z),-8);
 ZONES.forEach(function(zz,i){var el=$('#zl'+i);var dist=Math.hypot(p.x-zz.pos.x,p.z-zz.pos.z);if(dist>48||mode==='apply'){el.style.visibility='hidden';return;}place(el,new V3(zz.pos.x,zz.id===100?6.4:(zz.id===300?7.2:9),zz.pos.z),0);});
 mpOverlay();
 if(mode!=='intro')drawMap();
}

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
var last=performance.now();
function loop(now){var dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
